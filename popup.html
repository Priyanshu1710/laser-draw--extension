<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 220px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #111;
      }

      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }

      #toggle {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        color: white;
        background: rgba(0, 0, 0, 0.75);
        cursor: pointer;
      }

      #toggle.active {
        background: #ef4444;
      }

      #toggle:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #status {
        margin: 10px 0 0;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>☄️ Laser Draw</h1>
    <button id="toggle">Turn laser on</button>
    <p id="status">Shortcut: Alt+L · Esc to stop</p>
    <script src="popup.js"></script>
  </body>
</html>
